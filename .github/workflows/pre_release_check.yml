name: Pre-release Check

# Dry-run builds the published ESP32-C3 X4/X3 release environment, validates
# its artifact pair against the candidate tag, and checks that Auto Flash does
# not expose an X4 Pro image. Nothing is tagged or published.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Candidate release tag, e.g. 1.2.0.39-cpr-vcodex"
        required: true
        type: string
      flash_budget_percent:
        description: "Maximum flash usage percent of the X4/X3 OTA app slot (6.4 MB)"
        required: false
        default: "97.5"
        type: string

permissions:
  contents: read

jobs:
  pre-release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
          # but isn't picking them up reliably in this runner image, so pin them explicitly.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Run pre-release check (gh_release only)
        run: |
          python scripts/pre_release_check.py \
            --tag "${{ inputs.tag }}" \
            --env gh_release \
            --flash-budget-percent "${{ inputs.flash_budget_percent }}"

      - name: Upload firmware budget reports
        uses: actions/upload-artifact@v4
        with:
          name: CPR-vCodex-${{ inputs.tag }}-firmware-budget
          path: |
            artifacts/${{ inputs.tag }}-build.log
            artifacts/${{ inputs.tag }}-firmware-budget.json
            artifacts/${{ inputs.tag }}-firmware-budget.md
          if-no-files-found: error
