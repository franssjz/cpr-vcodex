name: Compile Release
on:
  push:
    tags:
      - '*-cpr-vcodex'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pio_env: gh_release
            asset_suffix: ''
          - pio_env: x4pro-gh_release
            asset_suffix: '-x4pro'
    steps:
      - name: Checkout repository
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF}"
          git checkout --force FETCH_HEAD
          git submodule update --init --recursive

      - name: Install PlatformIO Core
        run: |
          set -euo pipefail
          python3 -m pip install --user -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip || \
            python3 -m pip install --user --break-system-packages -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build CPR-vCodex release
        env:
          VCODEX_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          pio run -e "${{ matrix.pio_env }}" | tee "artifacts/${GITHUB_REF_NAME}${{ matrix.asset_suffix }}-build.log"

      - name: Report firmware budget
        if: matrix.pio_env == 'gh_release'
        run: |
          python3 scripts/firmware_budget_report.py \
            --tag "${GITHUB_REF_NAME}" \
            --build-log "artifacts/${GITHUB_REF_NAME}-build.log" \
            --fail-over-budget

      - name: Validate packaged release artifact
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          suffix="${{ matrix.asset_suffix }}"
          artifact="artifacts/${tag}${suffix}.bin"
          metadata="artifacts/${tag}${suffix}.json"

          test -f "${artifact}" || {
            echo "Expected packaged firmware ${artifact} was not created."
            echo "Available artifacts:"
            find artifacts -maxdepth 1 -type f -print || true
            exit 1
          }
          test -f "${metadata}" || {
            echo "Expected metadata ${metadata} was not created."
            exit 1
          }

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          suffix = os.environ["ASSET_SUFFIX"]
          metadata = json.loads(Path(f"artifacts/{tag}{suffix}.json").read_text(encoding="utf-8"))
          if metadata.get("artifactName") != f"{tag}{suffix}.bin":
              raise SystemExit(f"metadata artifactName mismatch: {metadata.get('artifactName')} != {tag}{suffix}.bin")
          if metadata.get("releaseAssetSuffix") != suffix:
              raise SystemExit(f"metadata suffix mismatch: {metadata.get('releaseAssetSuffix')} != {suffix}")
          if metadata.get("environment") != os.environ["PIO_ENV"]:
              raise SystemExit(f"unexpected release environment: {metadata.get('environment')}")
          print(f"Validated {metadata['artifactName']} ({metadata['firmwareBytes']} bytes)")
          PY
        env:
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
          PIO_ENV: ${{ matrix.pio_env }}

      - name: Upload packaged firmware
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.pio_env }}
          path: |
            artifacts/${{ github.ref_name }}${{ matrix.asset_suffix }}.bin
            artifacts/${{ github.ref_name }}${{ matrix.asset_suffix }}.json
            artifacts/${{ github.ref_name }}${{ matrix.asset_suffix }}-build.log
            artifacts/${{ github.ref_name }}-firmware-budget.json
            artifacts/${{ github.ref_name }}-firmware-budget.md
          if-no-files-found: ignore

  publish-release:
    runs-on: ubuntu-latest
    needs: build-release
    steps:
      - name: Checkout repository
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF}"
          git checkout --force FETCH_HEAD

      - name: Download packaged firmware
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          artifact="artifacts/${tag}.bin"
          x4pro_artifact="artifacts/${tag}-x4pro.bin"
          metadata="artifacts/${tag}.json"
          x4pro_metadata="artifacts/${tag}-x4pro.json"
          budget_json="artifacts/${tag}-firmware-budget.json"
          budget_md="artifacts/${tag}-firmware-budget.md"
          notes_file="$(mktemp)"

          python3 scripts/release_notes_from_changelog.py --tag "${tag}" > "${notes_file}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" \
              "${artifact}#${tag}.bin" \
              "${x4pro_artifact}#${tag}-x4pro.bin" \
              "${metadata}#${tag}.json" \
              "${x4pro_metadata}#${tag}-x4pro.json" \
              "${budget_json}#${tag}-firmware-budget.json" \
              "${budget_md}#${tag}-firmware-budget.md" \
              --clobber
            gh release edit "${tag}" --title "${tag}" --notes-file "${notes_file}"
          else
            gh release create "${tag}" \
              "${artifact}#${tag}.bin" \
              "${x4pro_artifact}#${tag}-x4pro.bin" \
              "${metadata}#${tag}.json" \
              "${x4pro_metadata}#${tag}-x4pro.json" \
              "${budget_json}#${tag}-firmware-budget.json" \
              "${budget_md}#${tag}-firmware-budget.md" \
              --verify-tag \
              --title "${tag}" \
              --notes-file "${notes_file}"
          fi
