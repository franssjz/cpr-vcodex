name: Sync Auto Flash Firmware

# Mirrors the latest stable ESP32-C3 X4/X3 release into docs/firmware/ for the
# browser flasher. X4 Pro distribution is withdrawn: the sync removes any
# stale X4 Pro copy and never adds it to the manifest.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch that GitHub Pages deploys from (receives the sync commit)
        required: false
        default: master

permissions:
  contents: write

jobs:
  sync-autoflash-firmware:
    runs-on: ubuntu-latest
    env:
      PAGES_BRANCH: ${{ github.event.inputs.branch || 'master' }}
    steps:
      - name: Checkout repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${PAGES_BRANCH}"
          git checkout --force FETCH_HEAD
          git switch -C "${PAGES_BRANCH}"

      - name: Sync firmware copies from latest stable release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_autoflash_firmware.py --repo "${GITHUB_REPOSITORY}"

      - name: Commit synchronized auto-flash firmware
        run: |
          set -euo pipefail
          # Stage docs/firmware as a directory so stale withdrawn files are
          # removed together with the regenerated manifest.
          git add -- README.md docs/assets/site.js docs/index.html docs/flash.html docs/firmware
          if git diff --cached --quiet; then
            echo "Auto-flash firmware is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: sync auto-flash firmware to ${AUTOFLASH_VERSION}"
          git push origin "HEAD:${PAGES_BRANCH}"
